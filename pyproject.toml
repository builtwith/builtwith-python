[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "builtwith-official"
version = "0.1.1"
description = "Official typed synchronous and asynchronous BuiltWith API SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BuiltWith Pty Ltd", email = "support@builtwith.com"}]
keywords = ["builtwith", "technology", "api", "agents", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://builtwith.com"
Documentation = "https://github.com/builtwith/builtwith-python#readme"
Repository = "https://github.com/builtwith/builtwith-python"
Issues = "https://github.com/builtwith/builtwith-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/builtwith_official"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: explicitly enabled, credit-free integration tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

